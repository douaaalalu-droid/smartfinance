{% extends "dashboard/base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h4 class="mb-3">✍️ تحليل مخصص</h4>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">اكتب طلب التحليل</label>
                <textarea name="prompt" class="form-control" rows="6" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                🚀 توليد التقرير
            </button>
        </form>
    </div>
</div>

{% endblock %}
