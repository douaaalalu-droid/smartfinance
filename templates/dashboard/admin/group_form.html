{% extends "dashboard/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            {{ title }}
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">اسم المجموعة</label>
                    {{ form.name }}
                </div>

                <div class="mb-3">
                    <label class="form-label">الصلاحيات</label>
                    <div class="border p-3" style="max-height: 400px; overflow:auto">
                        {{ form.permissions }}
                    </div>
                </div>

                <button class="btn btn-success">💾 حفظ</button>
                <a href="{% url 'admin_group_list' %}" class="btn btn-secondary">رجوع</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
